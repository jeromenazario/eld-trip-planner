services:
  - type: web
    name: eld-trip-planner-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
